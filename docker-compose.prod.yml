name: football-cards

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-footycards}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    # max_connections/shared_buffers: raised alongside the backend's DB pool
    # sizing (see backend/app/config.py) to handle a bigger concurrent user
    # base. Both require a Postgres restart to take effect (not reloadable),
    # which redeploying this compose file already does. shared_buffers at
    # ~25% of RAM is the standard starting-point tuning for a dedicated DB
    # host; sized here for an 8GB+ server — lower it if Postgres shares the
    # host with much else.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-400}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}"]
    # Docker's default /dev/shm is only 64MB, which is small enough to bite
    # a Postgres instance running parallel workers or bigger sorts under
    # real concurrency — bump it so raising shared_buffers above doesn't
    # leave Postgres shared-memory-starved.
    shm_size: '1gb'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-footycards}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEV_MODE: "false"
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-1234}@postgres:5432/${DB_NAME:-footycards}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${UVICORN_WORKERS:-4}"]
    volumes:
      - ./backend/static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-1234}@postgres:5432/${DB_NAME:-footycards}
      BOT_MODE: ${BOT_MODE:-polling}
    ports:
      - "${BOT_WEBHOOK_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_STATIC_URL: /static
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:dead:beef::/64
