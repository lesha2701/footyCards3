server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    location /bot/webhook {
        proxy_pass http://bot:8081/bot/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed static assets aggressively.
    location ~* \.(?:css|js|svg|webp|png|jpg|jpeg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be served from a stale cache: it names the hashed
    # bundles to load, and Telegram's in-app WebView (especially on phones)
    # otherwise keeps the old one — together with the old "immutable" bundles
    # — so players keep seeing the previous version after a deploy.
    # "no-cache" = may store, but must revalidate (cheap 304 when unchanged).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unknown path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
