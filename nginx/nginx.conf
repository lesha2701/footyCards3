# The compose network has IPv6 (docker-compose.prod.yml), so `backend` and
# `bot` resolve to an IPv4 and an IPv6 address. nginx's default (max_fails=1,
# fail_timeout=10s) took an address out for 10 s after a single failed
# connect: once both were out, every player got an error for 10 s — the
# intermittent black screen. max_fails=0: never take a server out, just try
# the next address for that request.
upstream backend_app {
    server backend:8000 max_fails=0;
}

upstream bot_app {
    server bot:8081 max_fails=0;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text: the app bundle (~720 KB → ~200 KB) and the API's JSON
    # (card lists compress 5–10×) — what a phone on a weak connection feels.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location /api/ {
        proxy_pass http://backend_app/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Card art and other uploads straight from disk (the backend's static dir
    # is mounted read-only at /srv/static), cached for a week — uploads get
    # unique names, so a new picture is a new URL. Anything not on disk falls
    # back to the backend.
    location ^~ /static/ {
        root /srv;
        expires 7d;
        try_files $uri @backend_static;
    }

    location @backend_static {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
    }

    location /bot/webhook {
        proxy_pass http://bot_app/bot/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed static assets aggressively.
    location ~* \.(?:css|js|svg|webp|png|jpg|jpeg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be served from a stale cache: it names the hashed
    # bundles to load, and Telegram's in-app WebView (especially on phones)
    # otherwise keeps the old one — together with the old "immutable" bundles
    # — so players keep seeing the previous version after a deploy.
    # "no-cache" = may store, but must revalidate (cheap 304 when unchanged).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unknown path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
